# Cross-builds the upstream warpgate release for FreeBSD and publishes it as a release of this repo
# (tag warpgate-<upstream tag>). Runs daily, so new upstream releases get a FreeBSD build automatically.
# A signed release then bumps PLUGIN_VERSION and publishes the plugin, so routers get it as a normal update.
# Without the SIGNING_KEY secret the release is left as a draft and nothing is bumped: the package build
# refuses unsigned binaries.
name: Build warpgate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag (empty = latest release)
        required: false
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: build-warpgate

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$(gh release view -R warp-tech/warpgate --json tagName -q .tagName)}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "warpgate-$tag" >/dev/null 2>&1; then
            echo "release warpgate-$tag already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          path: out/cache
          key: builder-${{ hashFiles('build/warpgate/Dockerfile') }}-${{ steps.tag.outputs.tag }}
          restore-keys: builder-${{ hashFiles('build/warpgate/Dockerfile') }}-

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        env:
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY_PEM" ]; then
            mkdir -p keys && (umask 077; printf '%s\n' "$SIGNING_KEY_PEM" > keys/signing.key)
          fi
          make binary TAG="${{ steps.tag.outputs.tag }}"
          rm -f keys/signing.key

      - name: Release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          draft=$(ls out/dist/*.sig >/dev/null 2>&1 || echo --draft)
          gh release create "warpgate-$TAG" out/dist/* $draft \
            --title "Warpgate $TAG for FreeBSD" \
            --notes "Unmodified upstream [warpgate $TAG](https://github.com/warp-tech/warpgate/releases/tag/$TAG), cross-compiled for FreeBSD (OPNsense). Patches applied: see build/warpgate/patches/."

      - name: Bump plugin and publish
        if: steps.tag.outputs.skip != 'true' && hashFiles('out/dist/*.sig') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sed -i "s/^PLUGIN_VERSION=.*/PLUGIN_VERSION=\t\t${TAG#v}/; /^PLUGIN_REVISION=/d" plugin/Makefile
          if ! git diff --quiet; then
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit -qam "os-warpgate: bundle warpgate $TAG"
            git push origin HEAD:main
          fi
          # pushes made with GITHUB_TOKEN do not trigger workflows; dispatch does
          gh workflow run publish-repo.yml --ref main
