# Generated by the OPNsense Warpgate plugin. Changes will be lost.
{# every string goes through tojson: a JSON string is a valid YAML scalar, so values cannot break the file #}
{% macro csv(value) %}{{ (value or '').split(',') | map('trim') | reject('equalto', '') | list | tojson }}{% endmacro %}
{% macro role_map(value) %}{
{%- for line in (value or '').splitlines() if '=' in line -%}
{%-   set kv = line.split('=', 1) -%}
{{ kv[0] | trim | tojson }}: {{ csv(kv[1]) }}{{ ', ' if not loop.last }}
{%- endfor -%} }{% endmacro %}
{% macro tls(wg, proto) %}
{%   set ref = wg[proto + '_certificate'] or wg.tls_certificate %}
{%   if ref %}
  certificate: "/var/db/warpgate/certs/{{ ref }}.pem"
  key: "/var/db/warpgate/certs/{{ ref }}.key"
{%   else %}
  certificate: /var/db/warpgate/tls.certificate.pem
  key: /var/db/warpgate/tls.key.pem
{%   endif %}
{% endmacro %}
{% macro listener(wg, addr, proto, toggle=true) %}
{{ proto }}:
{%   if toggle %}
  enable: {{ 'true' if wg[proto + '_enabled'] == '1' else 'false' }}
{%   endif %}
  listen: "{{ addr }}:{{ wg[proto + '_port'] }}"
  proxy_protocol: {{ 'true' if wg[proto + '_proxy_protocol'] == '1' else 'false' }}
{%   if wg[proto + '_external_host'] %}
  external_host: {{ wg[proto + '_external_host'] | tojson }}
{%   endif %}
{%   if wg[proto + '_external_port'] %}
  external_port: {{ wg[proto + '_external_port'] }}
{%   endif %}
{% endmacro %}
{% if helpers.exists('OPNsense.Warpgate') %}
{%   set wg = OPNsense.Warpgate %}
{%   set addr = '[' + wg.listen_address + ']' if ':' in wg.listen_address else wg.listen_address %}
database_url: {{ (wg.database_url or 'sqlite:/var/db/warpgate/db') | tojson }}
{%   if wg.external_host %}
external_host: {{ wg.external_host | tojson }}
{%   endif %}
log:
  format: {{ wg.log_format }}
  retention: {{ wg.log_retention | tojson }}
{%   if wg.log_audit_retention %}
  audit_retention: {{ wg.log_audit_retention | tojson }}
{%   endif %}
{%   if wg.log_send_to %}
  send_to: {{ wg.log_send_to | tojson }}
{%   endif %}
{{ listener(wg, addr, 'http', false) }}
  trust_x_forwarded_headers: {{ 'true' if wg.http_trust_x_forwarded == '1' else 'false' }}
  session_max_age: {{ wg.http_session_max_age | tojson }}
  cookie_max_age: {{ wg.http_cookie_max_age | tojson }}
{{ tls(wg, 'http') }}
{%   if wg.http_sni_certificates %}
  sni_certificates:
{%     for ref in wg.http_sni_certificates.split(',') %}
    - certificate: "/var/db/warpgate/certs/{{ ref }}.pem"
      key: "/var/db/warpgate/certs/{{ ref }}.key"
{%     endfor %}
{%   endif %}
{{ listener(wg, addr, 'ssh') }}
  host_key_verification: {{ wg.ssh_host_key_verification }}
  inactivity_timeout: {{ wg.ssh_inactivity_timeout | tojson }}
  target_handshake_timeout: {{ wg.ssh_target_handshake_timeout | tojson }}
{%   if wg.ssh_keepalive_interval %}
  keepalive_interval: {{ wg.ssh_keepalive_interval | tojson }}
{%   endif %}
{{ listener(wg, addr, 'mysql') }}
  advertised_version: {{ wg.mysql_advertised_version | tojson }}
{{ tls(wg, 'mysql') }}
{{ listener(wg, addr, 'postgres') }}
{{ tls(wg, 'postgres') }}
{{ listener(wg, addr, 'kubernetes') }}
  session_max_age: {{ wg.kubernetes_session_max_age | tojson }}
{{ tls(wg, 'kubernetes') }}
{{ listener(wg, addr, 'vnc') }}
  enable_ard_auth: {{ 'true' if wg.vnc_enable_ard_auth == '1' else 'false' }}
{{ tls(wg, 'vnc') }}
{{ listener(wg, addr, 'rdp') }}
{{ tls(wg, 'rdp') }}
sso_providers:
{%   for p in helpers.toList('OPNsense.Warpgate.sso_providers.provider') if p.enabled == '1' %}
  - name: {{ p.name | tojson }}
{%     if p.label %}
    label: {{ p.label | tojson }}
{%     endif %}
    auto_create_users: {{ 'true' if p.auto_create_users == '1' else 'false' }}
    disable_local_logout: {{ 'true' if p.disable_local_logout == '1' else 'false' }}
    return_url_domain: {{ p.return_url_domain }}
    return_url_prefix: {{ ('@' if p.return_url_prefix == 'at' else '_') | tojson }}
{%     if p.return_domain_whitelist %}
    return_domain_whitelist: {{ csv(p.return_domain_whitelist) }}
{%     endif %}
{%     set ns = namespace(policy=[]) %}
{%     for proto in ['http', 'ssh', 'mysql', 'postgres'] if p['credential_policy_' + proto] %}
{%       set ns.policy = ns.policy + [proto | tojson ~ ': ' ~ csv(p['credential_policy_' + proto])] %}
{%     endfor %}
{%     if ns.policy %}
    default_credential_policy: { {{ ns.policy | join(', ') }} }
{%     endif %}
{%     if p.kubernetes_client_id %}
    kubernetes:
      client_id: {{ p.kubernetes_client_id | tojson }}
{%       if p.kubernetes_client_secret %}
      client_secret: {{ p.kubernetes_client_secret | tojson }}
{%       endif %}
{%       if p.kubernetes_scopes %}
      scopes: {{ csv(p.kubernetes_scopes) }}
{%       endif %}
{%     endif %}
    provider:
      type: {{ p.type }}
      client_id: {{ p.client_id | tojson }}
      client_secret: {{ p.client_secret | tojson }}
{%     if p.type == 'custom' %}
      issuer_url: {{ p.issuer_url | tojson }}
      scopes: {{ csv(p.scopes) }}
      trust_unknown_audiences: {{ 'true' if p.trust_unknown_audiences == '1' else 'false' }}
{%       for key in ['roles_claim', 'admin_roles_claim'] if p[key] %}
      {{ key }}: {{ p[key] | tojson }}
{%       endfor %}
{%       if p.additional_trusted_audiences %}
      additional_trusted_audiences: {{ csv(p.additional_trusted_audiences) }}
{%       endif %}
{%     elif p.type == 'google' %}
{%       for key in ['admin_email', 'service_account_email', 'service_account_key'] if p[key] %}
      {{ key }}: {{ p[key] | tojson }}
{%       endfor %}
{%     elif p.type == 'azure' %}
      tenant: {{ p.tenant | tojson }}
{%     elif p.type == 'apple' %}
      key_id: {{ p.key_id | tojson }}
      team_id: {{ p.team_id | tojson }}
{%     endif %}
{%     if p.type in ['custom', 'google'] %}
{%       for key in ['role_mappings', 'admin_role_mappings'] if p[key] %}
      {{ key }}: {{ role_map(p[key]) }}
{%       endfor %}
{%     endif %}
{%   else %}
  []
{%   endfor %}
{% endif %}
