[start]
command:/usr/local/etc/rc.d/warpgate start
parameters:
type:script
message:Starting Warpgate

[stop]
command:/usr/local/etc/rc.d/warpgate stop
parameters:
type:script
message:Stopping Warpgate

[restart]
command:/usr/local/etc/rc.d/warpgate restart
parameters:
type:script
message:Restarting Warpgate

[status]
command:/usr/local/etc/rc.d/warpgate status; exit 0
parameters:
type:script_output
message:Requesting Warpgate status

[cli]
command:/usr/local/opnsense/scripts/OPNsense/Warpgate/wgctl.py
parameters:%s %s %s
type:script_output
message:Running warpgate command %s
